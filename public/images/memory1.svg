<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdde1" />
      <stop offset="50%" stop-color="#ee9ca7" />
      <stop offset="100%" stop-color="#ff758f" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#c9184a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#bg1)" />
  <!-- Sparkles -->
  <text x="50" y="70" font-size="24" fill="#ffffff" opacity="0.8">✨</text>
  <text x="330" y="90" font-size="28" fill="#ffffff" opacity="0.8">🌸</text>
  <text x="320" y="320" font-size="22" fill="#ffffff" opacity="0.8">💖</text>
  <text x="60" y="340" font-size="24" fill="#ffffff" opacity="0.8">✨</text>
  <!-- Center circle frame -->
  <circle cx="200" cy="180" r="100" fill="rgba(255, 255, 255, 0.45)" filter="url(#shadow1)"/>
  <circle cx="200" cy="180" r="92" fill="#fff5f7" />
  <!-- Cute character emojis -->
  <text x="200" y="195" font-size="70" text-anchor="middle" dominant-baseline="middle">👧👦</text>
  <!-- Ribbon caption -->
  <rect x="60" y="295" width="280" height="48" rx="24" fill="rgba(255,255,255,0.92)" filter="url(#shadow1)" />
  <text x="200" y="325" font-family="'Quicksand', sans-serif" font-weight="700" font-size="16" fill="#c9184a" text-anchor="middle">Silly Sibling Adventures 💗</text>
</svg>
